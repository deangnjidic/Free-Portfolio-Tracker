<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Free Portfolio Tracker for Couples</title>
  <desc id="description">Track individual and joint investments in one portfolio.</desc>
  <defs>
